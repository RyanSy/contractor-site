backend:
  name: github
  repo: your-github-username/contractor-site
  branch: main
  auth_type: implicit
  app_id: your_github_oauth_app_client_id

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "homepage"
    label: "Homepage"
    file: "src/content/homepage.json"
    fields:
      - { label: "Hero Title", name: "heroTitle", widget: "string" }
      - { label: "Hero Subtitle", name: "heroSubtitle", widget: "text" }
      - { label: "Hero Image", name: "heroImage", widget: "image", required: false }
      - { label: "About Title", name: "aboutTitle", widget: "string" }
      - { label: "About Body", name: "aboutBody", widget: "text" }
      - { label: "Services Title", name: "servicesTitle", widget: "string" }
      - { label: "Services Intro", name: "servicesIntro", widget: "text" }
      - label: "Services"
        name: "services"
        widget: "list"
        fields:
          - { label: "Name", name: "name", widget: "string" }
          - { label: "Description", name: "description", widget: "text" }
      - { label: "Contact Title", name: "contactTitle", widget: "string" }
      - { label: "Contact Subtitle", name: "contactSubtitle", widget: "text" }

  - name: "gallery"
    label: "Project Gallery"
    folder: "src/content/gallery"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - label: "Images"
        name: "images"
        widget: "list"
        field: { label: "Image", name: "image", widget: "image" }
